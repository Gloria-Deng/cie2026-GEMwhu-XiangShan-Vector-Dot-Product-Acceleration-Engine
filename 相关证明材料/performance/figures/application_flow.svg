   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Microsoft YaHei'; text-anchor: start" x="32.73984" y="36.295295" transform="rotate(-0 32.73984 36.295295)">应用如何调用点积指令，以及时间花在哪里</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start" x="32.73984" y="60.03072" transform="rotate(-0 32.73984 60.03072)">计算前：检查尺寸与输出空间，明确选择 C_REFERENCE 或 CUSTOM_VDOT。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="118.93248" y="118.487345" transform="rotate(-0 118.93248 118.487345)">连续输入</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(93.934824 143.494459)">A 为行连续</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(84.315292 158.770397)">B 转置为连续列</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="316.975104" y="118.487345" transform="rotate(-0 316.975104 118.487345)">共享装载</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(291.977448 143.494459)">四列共用 A</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(292.357916 158.770397)">分别装入 B</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="515.017728" y="118.487345" transform="rotate(-0 515.017728 118.487345)">指令计算</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(472.717728 143.494459)">每八字节一次 vdot</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(470.017728 158.770397)">结果留在向量寄存器</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="713.060352" y="118.487345" transform="rotate(-0 713.060352 118.487345)">累加与写回</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(686.400196 143.494459)">按 e32 累加</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(673.060352 158.770397)">每个输出末尾取出</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #21654b" x="417.6" y="214.92864" transform="rotate(-0 417.6 214.92864)">矩阵计时区间：数据整理＋装载＋点积＋累加＋输出</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="213.14304" y="278.983985" transform="rotate(-0 213.14304 278.983985)">取回结果的两种实现</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(140.183665 303.991099)">旧路径：向量存内存 → 标量读回</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(130.98679 319.267037)">改进路径：vmv.x.s 直接取出低 32 位</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="606.02112" y="278.983985" transform="rotate(-0 606.02112 278.983985)">独立点积数量比较</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(520.469557 303.991099)">每次循环放入 1、2、4、8、16 个点积</text>
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'" transform="translate(526.02112 319.267037)">先确认完整结果，再比较处理器周期</text>
   </g>
  </g>
 </g>
